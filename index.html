<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한남 상품별 매출 분석</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172238;font:15px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}main{max-width:1260px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce3eb;padding-bottom:18px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:20px;margin:0 0 22px}.muted{color:#77869b;font-size:13px}.tabs,.filters{display:flex;gap:9px;flex-wrap:wrap}.tabs{margin:26px 0}.tabs button,.filters button{cursor:pointer;border:1px solid #dce3ec;background:#fff;border-radius:12px;padding:12px 22px;font-weight:700;color:#42516a}.tabs button.active,.filters button.active{background:#192c49;color:white;border-color:#192c49}.filters button{padding:8px 14px;font-size:13px}.card{background:white;border:1px solid #e4e9f0;border-radius:18px;padding:28px;margin-bottom:18px;box-shadow:0 7px 24px #132b4908}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric b{display:block;font-size:30px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart{overflow-x:auto}svg{display:block;width:100%;min-width:580px;height:320px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:13px 8px;text-align:right;border-bottom:1px solid #edf0f4}th:first-child,td:first-child{text-align:left}th{color:#7a8799;font-size:12px}.rank{display:grid;grid-template-columns:74px 1fr 110px;gap:12px;align-items:center;margin:16px 0}.track{height:10px;background:#eff2f7;border-radius:9px;overflow:hidden}.bar{height:100%;border-radius:9px}.pct{font-size:12px;font-weight:700}.up{color:#15956d}.down{color:#d85c60}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;color:#66758b;font-size:12px}footer{display:flex;justify-content:space-between;padding:24px 0;color:#7a8799;font-size:12px}@media(max-width:760px){main{padding:20px 12px}.metrics,.grid{grid-template-columns:1fr}.card{padding:19px}h1{font-size:23px}}</style></head><body><main><header><div><div class="muted">WESTVIEW INVESTMENT INC. / 경영지원팀</div><h1>상품별 판매 실적 분석</h1><div class="muted">2026.08.30 ~ 2026.10.17</div></div><div class="muted">대외비</div></header><div class="tabs"><button id="tabch" onclick="change('ch')">한치킨</button><button id="tabbu" onclick="change('bu')">붕어빵</button></div><div class="metrics"><div class="card metric"><div class="muted">최근 주간 매출</div><b id="total"></b></div><div class="card metric"><div class="muted">전주 대비</div><b id="growth"></b></div><div class="card metric"><div class="muted">분석 기간</div><b id="period"></b></div></div><section class="card"><h2>01 | 지점별 주간 매출 추이</h2><div class="filters" id="filter"></div><div class="chart" id="weekly"></div><div class="muted" style="margin-top:10px">전주 대비 증감률은 아래 표에서 확인</div><div style="overflow:auto" id="weeklytable"></div></section><div class="grid"><section class="card"><h2>02 | 최근 주간 지점별 매출</h2><div id="ranks"></div></section><section class="card"><h2>03 | 최근 주간 일별 추이</h2><div class="chart" id="daychart"></div></section></div><section class="card"><h2>04 | 최근 주간 일별 실적</h2><div style="overflow:auto" id="daytable"></div></section><footer><span>한남 경영지원팀</span><span>대외비 | 1/1</span></footer></main><script>const W={"ch":[[1148.85,829.17,1664.33,2193.8,727.27,0],[1408.59,769.23,2112.85,2237.76,619.37,69.93],[1408.59,1258.74,2138.82,2267.73,794.19,249.75],[1238.76,569.43,1668.33,1986.01,709.29,139.86],[1458.54,649.35,1654.34,2107.89,612.37,109.89],[1748.25,679.32,2203.79,2199.78,454.54,129.87],[2027.97,769.23,1966.03,2093.9,600.37,119.88]],"bu":[[2391.25,0,497.34,416.21,0,0],[2296.44,596.93,918.89,1029.11,472.82,0],[2049.03,909.98,2113.79,1523.15,561.66,0],[2436.72,2487.15,2039.09,1642.47,739.69,0],[2073.82,1904.6,2172.02,1966.12,738.85,0],[2398.89,2339.1,2235.27,2169.1,743.34,0]]},DAY={"ch":[[409.59,209.79,368.63,299.7,49.95,13.95],[319.68,49.95,279.72,255.74,66.93,19.98],[119.88,139.86,129.87,189.81,77.91,19.98],[159.84,89.91,159.84,319.68,84.91,20.97],[219.78,89.91,179.82,289.71,89.91,19.98],[329.67,109.89,368.63,419.58,123.37,9.99],[469.53,79.92,479.52,319.68,107.39,19.98]],"bu":[[554.21,235,559.19,429.84,139.36,0],[378.03,238,264.63,407.95,114.44,0],[229.78,316.35,310.74,264.67,105.47,0],[359.36,362,260.74,272.63,65.67,0],[284.67,467,285.59,125.37,125.37,0],[256.42,431.75,189.28,278.6,61.69,0],[336.42,289,365.1,390.04,131.34,0]]},N=['버나비','써리','랭리','메트로','랍슨','예일'],COL=['#e65c5b','#3e70d5','#19a787','#8d60c5','#d89b36','#17a1ba'],WK={ch:['8/30','9/6','9/13','9/20','9/27','10/4','10/11'],bu:['9/6','9/13','9/20','9/27','10/4','10/11']},DN=['일','월','화','수','목','금','토'];let tab='ch',sel=-1;const sum=a=>a.reduce((x,y)=>x+y,0),fmt=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}),pct=(a,b)=>b?(a/b-1)*100:null;function change(t){tab=t;sel=-1;render()}function choose(i){sel=sel===i?-1:i;render()}function line(rows,labels){let ids=sel<0?[0,1,2,3,4,5]:[sel],max=Math.max(1,...rows.flatMap(r=>ids.map(i=>r[i])))*1.15,w=900,h=290,pad=55,step=(w-pad*2)/(rows.length-1);let parts=['<svg viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet">'];for(let k=0;k<5;k++){let y=20+k*60;parts.push('<line x1="55" y1="'+y+'" x2="850" y2="'+y+'" stroke="#e8edf4"/>')}ids.forEach(i=>{let points=rows.map((r,j)=>[pad+j*step,260-r[i]/max*225]);parts.push('<polyline fill="none" stroke="'+COL[i]+'" stroke-width="'+(sel===i?4:2.7)+'" stroke-linejoin="round" stroke-linecap="round" points="'+points.map(p=>p.join(',')).join(' ')+'"/>');points.forEach(p=>parts.push('<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+COL[i]+'"/>'))});labels.forEach((s,j)=>parts.push('<text x="'+(pad+j*step)+'" y="302" text-anchor="middle" fill="#7a8799" font-size="14">'+s+'</text>'));parts.push('</svg><div class="legend">'+ids.map(i=>'<span><span style="color:'+COL[i]+'">●</span> '+N[i]+'</span>').join('')+'</div>');return parts.join('')}function render(){let w=W[tab],d=DAY[tab],last=w.at(-1),prev=w.at(-2),tot=sum(last),pt=sum(prev),g=pct(tot,pt);document.getElementById('tabch').classList.toggle('active',tab==='ch');document.getElementById('tabbu').classList.toggle('active',tab==='bu');document.getElementById('total').textContent=fmt(tot);document.getElementById('growth').textContent=(g>=0?'+':'')+g.toFixed(1)+'%';document.getElementById('growth').className=g>=0?'up':'down';document.getElementById('period').textContent=w.length+'주';document.getElementById('filter').innerHTML='<button class="'+(sel<0?'active':'')+'" onclick="choose(-1)">전체 지점</button>'+N.map((n,i)=>'<button class="'+(sel===i?'active':'')+'" onclick="choose('+i+')">'+n+'</button>').join('');document.getElementById('weekly').innerHTML=line(w,WK[tab]);let mx=Math.max(...last);document.getElementById('ranks').innerHTML=last.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).map(({v,i})=>'<div class="rank"><span>'+N[i]+'</span><div class="track"><div class="bar" style="width:'+(v/mx*100)+'%;background:'+COL[i]+'"></div></div><b style="text-align:right">'+fmt(v)+'</b></div>').join('');document.getElementById('daychart').innerHTML=line(d,DN);let ids=sel<0?[0,1,2,3,4,5]:[sel];document.getElementById('weeklytable').innerHTML='<table><thead><tr><th>주간</th>'+ids.map(i=>'<th>'+N[i]+'</th>').join('')+'</tr></thead><tbody>'+w.map((row,j)=>'<tr><td>'+WK[tab][j]+'</td>'+ids.map(i=>{let v=pct(row[i],j?w[j-1][i]:0);return '<td>'+fmt(row[i])+(j&&v!==null?'<div class="pct '+(v>=0?'up':'down')+'">'+(v>=0?'+':'')+v.toFixed(1)+'%</div>':'')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>';document.getElementById('daytable').innerHTML='<table><thead><tr><th>날짜</th>'+ids.map(i=>'<th>'+N[i]+'</th>').join('')+'</tr></thead><tbody>'+d.map((row,j)=>'<tr><td>10/'+(11+j)+' '+DN[j]+'</td>'+ids.map(i=>'<td>'+fmt(row[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}render();</script></body></html>
