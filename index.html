<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한남 | 한치킨·붕어빵 매출</title><style>body{margin:0;background:#f5f7fb;color:#17253d;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{max-width:1200px;margin:auto;padding:36px 22px}header{display:flex;justify-content:space-between;align-items:center}small{color:#748399}.tabs{display:flex;gap:8px;margin:26px 0}.tabs button{border:1px solid #dbe2ed;background:white;border-radius:12px;padding:14px 30px;font-weight:700;cursor:pointer}.tabs button.on{background:#192b47;color:white}.card{background:white;border:1px solid #e3e8f0;border-radius:20px;padding:28px;margin:18px 0;box-shadow:0 8px 24px #14243a09}h1{font-size:30px}h2{font-size:20px}strong.total{font-size:38px}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{padding:8px 13px;border:1px solid #dbe2ed;background:white;border-radius:30px;cursor:pointer}nav button.on{background:#192b47;color:white}.row{display:grid;grid-template-columns:90px 1fr 110px;gap:18px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f5}.track{height:11px;background:#edf1f7;border-radius:9px;overflow:hidden}.bar{height:100%;border-radius:9px}svg{width:100%;height:320px;overflow:visible}table{width:100%;border-collapse:collapse}th,td{padding:13px 8px;border-bottom:1px solid #edf0f5;text-align:right}th:first-child,td:first-child{text-align:left}footer{padding:30px 0;color:#718096;font-size:12px;display:flex;justify-content:space-between}@media(max-width:650px){main{padding:20px 12px}.card{padding:18px}.row{grid-template-columns:55px 1fr 88px;gap:9px}h1{font-size:23px}}</style><main><header><div><small>WESTVIEW INVESTMENT INC. / 경영지원팀</small><h1>한남 상품별 매출 대시보드</h1><small>2026.10.11 ~ 10.17</small></div><small>대외비</small></header><div class="tabs"><button id="ch" class="on" onclick="switchTab('ch')">한치킨</button><button id="bu" onclick="switchTab('bu')">붕어빵</button></div><div class="card"><small>최근 주간 매출</small><p><strong class="total" id="total"></strong></p><small>지점별 매출 및 일별 추이</small></div><section class="card"><h2>01 | 지점별 매출</h2><div id="ranks"></div></section><section class="card"><h2>02 | 최근 주간 일별 매출</h2><nav id="filters"></nav><div id="graph" style="margin-top:26px"></div></section><section class="card"><h2>03 | 일별 전체 매출</h2><div id="daily"></div></section><footer><span>한남 경영지원팀</span><span>대외비 | 1/1</span></footer></main><script>
const S=['버나비','써리','랍슨','랭리','예일','메트로'],C=['#ec635e','#346cc5','#77ad56','#8a59c8','#d5a343','#1994b0'],D=['일','월','화','수','목','금','토'];
const data={ch:{total:7584.31,stores:[2027.97,769.23,600.37,1966.03,126.81,2093.90],daily:[1351.61,992,677.31,835.15,889.11,1363.11,1476.02]},bu:{total:9885.70,stores:[2398.89,2339.10,743.34,2235.27,0,2169.10],daily:[1917.60,1403.05,1227.01,1320.40,1288,1217.74,1511.90]}};
let tab='ch',selected=-1;const money=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
function switchTab(t){tab=t;selected=-1;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.id===t));render()}
function pick(i){selected=selected===i?-1:i;render()}
function render(){let d=data[tab];document.getElementById('total').textContent=money(d.total);let mx=Math.max(...d.stores);document.getElementById('ranks').innerHTML=d.stores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).map(({v,i})=>'<div class="row"><span>'+S[i]+'</span><div class="track"><div class="bar" style="width:'+(v/mx*100)+'%;background:'+C[i]+'"></div></div><b style="text-align:right">'+money(v)+'</b></div>').join('');
document.getElementById('filters').innerHTML='<button class="'+(selected===-1?'on':'')+'" onclick="pick(-1)">전체</button>'+S.map((s,i)=>'<button class="'+(selected===i?'on':'')+'" onclick="pick('+i+')" style="border-bottom:3px solid '+C[i]+'">'+s+'</button>').join('');
let vals=d.daily;if(selected>=0){document.getElementById('graph').innerHTML='<p style="color:#66768a">선택 지점의 일별 원본 데이터는 추가 업로드 후 표시</p>'}else{let w=1000,h=270,mx=Math.max(...vals)*1.13;let pts=vals.map((v,i)=>[45+i*150,240-v/mx*215]);let path=pts.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');document.getElementById('graph').innerHTML='<svg viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="#3473cc" stroke-width="4" stroke-linejoin="round"/>'+pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#3473cc"/><text x="'+p[0]+'" y="'+(p[1]-17)+'" text-anchor="middle" font-size="18" fill="#25334b">'+Math.round(vals[i]).toLocaleString()+'</text><text x="'+p[0]+'" y="280" text-anchor="middle" font-size="18" fill="#6c7889">'+D[i]+'</text>').join('')+'</svg>'}
document.getElementById('daily').innerHTML='<table><tr><th>날짜</th><th>매출</th><th>전일 대비</th></tr>'+vals.map((v,i)=>'<tr><td>10/'+(11+i)+' ('+D[i]+')</td><td>'+money(v)+'</td><td>'+(i?((v/vals[i-1]-1)*100).toFixed(1)+'%':'—')+'</td></tr>').join('')+'</table>'}
render();</script></html>
